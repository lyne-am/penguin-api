
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penguin Species Predictor</title>
</head>
<body>
  <h1>Penguin Species Predictor</h1>
  <p>Enter the penguin's measurements:</p>

  <form id="form">
    <label>Bill length (mm)
      <input name="bill_length_mm" type="number" step="any" value="39.1" required>
    </label>
    <label>Bill depth (mm)
      <input name="bill_depth_mm" type="number" step="any" value="18.7" required>
    </label>
    <label>Flipper length (mm)
      <input name="flipper_length_mm" type="number" step="any" value="181" required>
    </label>
    <label>Body mass (g)
      <input name="body_mass_g" type="number" step="any" value="3750" required>
    </label>
    <button type="submit">Predict</button>
  </form>

  <p id="out"></p>

  <script>
    document.getElementById("form").onsubmit = async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const response = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      const result = await response.json();
      document.getElementById("out").textContent =
        response.ok ? result.species : "Prediction failed";
    };
  </script>
</body>
</html>
